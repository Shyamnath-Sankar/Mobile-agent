name: Android APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
    inputs:
      zeroclaw_tag:
        description: "ZeroClaw release tag to bundle (default: latest)"
        required: false
        default: "latest"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch ZeroClaw Android release
        env:
          ZEROCLAW_TAG: ${{ inputs.zeroclaw_tag || 'latest' }}
        run: bash scripts/fetch-zeroclaw.sh

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Show APK
        run: ls -l app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
